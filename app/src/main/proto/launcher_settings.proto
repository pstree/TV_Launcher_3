syntax = "proto3";

option java_package = "com.github.honqout.tvlauncher3";
option java_multiple_files = true;

// The application that should be launched automatically after the device boots.
// An empty packageName means "no auto-start app".
message LauncherSettings {
    string auto_start_package_name = 1;
    string auto_start_activity_name = 2;
    // The BOOT_COUNT value that was already handled, so the auto-start app is launched only once
    // per boot even if the launcher activity is recreated.
    int64 last_auto_start_boot_id = 3;
}
